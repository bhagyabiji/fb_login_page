<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Facebook</title>
    <link rel="stylesheet" href="./stylefb.css">

    <link rel="icon" type="image/x-icon" href="https://img.icons8.com/?size=512&id=uLWV5A9vXIPu&format=png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <div id="title">
            <h1>facebook</h1>
            <p>Connect with friends and the world <br> around you on Facebook.</p>
        </div>
        <div class="loginpage">
            <form  action="">
                <input class="inputbox" type="email" placeholder="Email or Phone Number" required>
                <input class="inputbox" type="password" placeholder="Password" required>
                <div class="signin">
                    <button id="logbutton">Login</button>
                    <a id="forget" href="https://www.facebook.com/recover/initiate/?ars=facebook_login&cancel_lara_pswd=0" target="_blank">Forgot password?</a>
                    <br/>
                </div>
                <hr>
                <br/>
                <div class="createbutton">
                    <a id="account" href="https://www.facebook.com/r.php?locale=en_GB&display=page" target="_blank">Create new account</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
